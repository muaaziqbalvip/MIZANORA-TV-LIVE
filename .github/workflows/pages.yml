name: MIZANORA · Retry Pages Build (manual)

# ─────────────────────────────────────────────────────────────────────────────
# ⚠️ DO NOT re-add a `push:` trigger here.
#
# Is repo me Pages pehle se "Deploy from a branch → main /docs"
# (build_type: legacy) par set hai. Pehle is workflow me `push` trigger + 
# actions/deploy-pages tha, to har merge par DO deploy ek saath chalte the:
#   1) GitHub ka built-in "pages build and deployment" (dynamic, branch source)
#   2) ye Actions-based deploy job
# Dono ek hi `github-pages` environment par likhte hain → runs 10+ minute QUEUED
# rehte the aur phir CANCELLED (17:03 CI + pages.yml + dynamic → 17:13 cancelled).
#
# FIX: ab ye workflow SIRF manual hai aur sirf EK kaam karta hai — branch-based
# Pages ka naya build request karta hai (purana stuck build auto cancel ho jata
# hai). Normal deployment branch source khud karta hai = 0 Actions minutes.
#
# Agar KABHI Pages source "GitHub Actions" me badalna ho to tab alag se
# configure-pages/upload-pages-artifact/deploy-pages wala job add karein —
# dono sources kabhi bhi ek sath enable na karein.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'why retry?'
        required: false
        default: 'stuck build / manual retry'

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request a fresh Pages build from main /docs
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ inputs.reason || github.event.inputs.reason || 'manual' }}
        run: |
          echo "▶ Manual Pages rebuild: $REASON"
          echo "▶ Purana queued 'pages build and deployment' run auto cancel ho jayega."
          if gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null 2>&1; then
            echo "✔ Naya Pages build queue ho gaya. 1–3 minute me site live ho jayegi."
          else
            echo "::warning::API se build request nahi gaya — GitHub UI me"
            echo "::warning::Settings → Pages → source dobara Save karein ya Actions me"
            echo "::warning::'pages build and deployment' run par Re-run all jobs dabayein."
          fi
      - name: Show latest Pages build status
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '{status,commit,created_at,error}'
